# MediaMTX config for the demo RTSP sources.
#
# Each path loops a pre-rendered H.264 clip (see make-clips.sh) with FFmpeg.
# The clips are copied, not re-encoded, so a source costs almost no CPU, and
# runOnDemand only starts the publisher while someone is reading the path.

logLevel: warn

# Only RTSP is needed.
rtsp: true
rtspTransports: [tcp]
rtspAddress: :8554
rtmp: false
hls: false
webrtc: false
srt: false
moq: false
api: false

pathDefaults:
  runOnDemandRestart: true
  runOnDemandStartTimeout: 15s
  runOnDemandCloseAfter: 15s

paths:
  testsrc:
    runOnDemand: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i /media/testsrc.mp4 -c copy -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH
  mandelbrot:
    runOnDemand: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i /media/mandelbrot.mp4 -c copy -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH
  life:
    runOnDemand: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i /media/life.mp4 -c copy -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH
  gradients:
    runOnDemand: ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i /media/gradients.mp4 -c copy -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH
  # Anything else can be published by an RTSP client, e.g. a live FFmpeg test source.
  all_others:
